<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo Sin Conexión - CatInk</title>
  <link rel="icon" href="./catink-icon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #121216;
      --card-bg: #1a1a20;
      --accent: #EF3363;
      --accent-hover: #d62250;
      --text: #ffffff;
      --muted: #a0a0ab;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .offline-container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .offline-icon-box {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      background: rgba(239, 51, 99, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: var(--accent);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(239, 51, 99, 0.3);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="offline-container">
  <div class="offline-icon-box">
    <i class="bi bi-wifi-off"></i>
  </div>
  <h1>Estás sin conexión</h1>
  <p>No se pudo conectar a internet para cargar esta página. Puedes acceder a las noticias que has guardado previamente para leer sin conexión.</p>
  
  <div class="btn-group">
    <a href="./guardados" class="btn btn-primary">
      <i class="bi bi-bookmark-check-fill"></i> Ver mis Lecturas Guardadas
    </a>
    <button onclick="window.location.reload()" class="btn btn-secondary">
      <i class="bi bi-arrow-clockwise"></i> Reintentar conexión
    </button>
  </div>
</div>

</body>
</html>
